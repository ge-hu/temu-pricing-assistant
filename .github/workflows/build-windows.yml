name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract and normalize v0.7.6 project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*v0.7.6*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw 'v0.7.6 project ZIP was not found in repository root.' }
          Write-Host "Using package: $($zip.Name)"
          $dest = Join-Path $env:RUNNER_TEMP 'temu-source'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $pkg = Get-ChildItem -Path $dest -Filter 'package.json' -Recurse | Select-Object -First 1
          if (-not $pkg) { throw 'package.json was not found after extracting ZIP.' }
          $project = $pkg.Directory.FullName
          $versionFiles = @(
            'package.json',
            'README.md',
            'settings.html',
            'app\index.html',
            'release-manifest.example.json'
          )
          foreach ($relativePath in $versionFiles) {
            $path = Join-Path $project $relativePath
            if (Test-Path $path) {
              $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
              $text = $text -replace '0\.7\.5', '0.7.6'
              Set-Content -LiteralPath $path -Value $text -Encoding UTF8
            }
          }
          $package = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
          if ($package.version -ne '0.7.6') { throw "Expected package version 0.7.6, got $($package.version)." }
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project directory: $project"

      - name: Validate JavaScript
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          node --check main.js
          node --check preload.js
          node --check floating.js
          node --check settings.js

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Build installer and portable Windows EXEs
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run dist:win:all
          $dist = Join-Path $env:PROJECT_DIR 'dist'
          $installer = Get-ChildItem -Path $dist -Filter '*安装版*0.7.6*x64*.exe' | Select-Object -First 1
          $portable = Get-ChildItem -Path $dist -Filter '*便携版*0.7.6*x64*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'v0.7.6 installer EXE was not generated.' }
          if (-not $portable) { throw 'v0.7.6 portable EXE was not generated.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-v0.7.6'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $out -Force
          Copy-Item -LiteralPath $portable.FullName -Destination $out -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload v0.7.6 Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Temu-Pricing-Assistant-v0.7.6-Windows-x64
          path: windows-v0.7.6/*.exe
          if-no-files-found: error
          retention-days: 30
