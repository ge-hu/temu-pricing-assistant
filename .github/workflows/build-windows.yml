name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-windows.yml'
      - '.github/v075-overlay/**'
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract desktop project
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.zip'
          $versioned = @()
          foreach ($file in $candidates) {
            if ($file.Name -match 'v(?<version>\d+\.\d+\.\d+)') {
              $versioned += [PSCustomObject]@{
                File = $file
                Version = [version]$Matches.version
              }
            }
          }
          if ($versioned.Count -gt 0) {
            $zip = ($versioned | Sort-Object Version -Descending | Select-Object -First 1).File
          } else {
            $zip = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $zip) {
            throw 'No project ZIP found in repository root.'
          }
          Write-Host "Using package: $($zip.Name)"
          $dest = Join-Path $env:RUNNER_TEMP 'temu-source'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $pkg = Get-ChildItem -Path $dest -Filter 'package.json' -Recurse | Select-Object -First 1
          if (-not $pkg) { throw 'package.json was not found after extracting ZIP.' }
          $project = $pkg.Directory.FullName
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project directory: $project"

      - name: Apply v0.7.5 store confirmation fix
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\v075-overlay\apply-v075-overlay.ps1" -ProjectDir $env:PROJECT_DIR
          Get-Content (Join-Path $env:PROJECT_DIR 'package.json') | Select-String '"version"'

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Build portable Windows EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm run dist:win
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-build'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -Path (Join-Path $env:PROJECT_DIR 'dist\*.exe') -Destination $out -Force
          Get-ChildItem $out

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Temu-Pricing-Assistant-Windows-x64-v0.7.5
          path: windows-build/*.exe
          if-no-files-found: error
          retention-days: 30
